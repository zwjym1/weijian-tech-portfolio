workflow:
  root: /workspace/archive-studio           # W1；2026-10-22 用户批全案推荐
  legacy_root_readonly: /workspace/science-studio   # W2：旧目录只读保留，旧 skill 停用不删；2026-10-22 用户批全案推荐
  gates: [topic_pick, script_approve, vo_listen, cut_review]   # W3：只设 4 个闸口，取消创意方向闸口；2026-10-22 用户批全案推荐
