# 以后换角色、换名字只改这里，不推倒重来。
# 注意：用户已取消的 7 条（电平目标、禁用音效清单、强制印章、发布组件和定位、固定 BGM、LUFS、峰值）不在本文件中设任何字段或检查。

version: 1
decided_at: "2026-10-22 23:43 (UTC+8)"

# ---- D 项（账号蓝图）----
