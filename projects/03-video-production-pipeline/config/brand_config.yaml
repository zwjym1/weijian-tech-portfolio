  host:
    id: mishucheng                          # 2026-10-23 用户定：主理人=账号本人「秘书丞」，以旧 Q 版小官（/workspace/brand/v2/qban/Q1_*）为原型重画档案风
    name: "秘书丞"
    persona: "揭穿真相的档案官：古代掌管文书的官，冷静可信、略带调侃；每期调出一份卷宗，拆一个局"
    identity_core: [乌纱帽两侧长翅剪影, 朱红官袍, 文书官身份（卷宗/朱笔）]
    look_candidates:                        # v3 候选，总览 assets/cast/host_mishucheng/host_v3_overview.jpg（AI 生成）
      S1: {name: 纸偶剪纸版, card: assets/cast/host_mishucheng/S1_paper_puppet/card_v1.jpg, status: selected}
      S2: {name: 半写实插画版, card: assets/cast/host_mishucheng/S2_illustrated/card_v1.jpg, status: not_selected}
      S3: {name: 极简符号版, card: assets/cast/host_mishucheng/S3_symbol/card_v1.jpg, status: not_selected}
    look_current: S1                        # 2026-10-23 用户定：S1 纸偶剪纸版原样（不融合 S2/S3）
    parts_dir: assets/cast/host_mishucheng/S1_paper_puppet/parts   # Remotion 透明底分件 + 三张换脸
    expressions: [calm, smirk, expose]      # 平静讲述 / 挑眉调侃 / 瞪眼揭穿
    rejected:                               # 用户否决，素材移到 assets/cast/_rejected/
      - {id: H1_faceless_archivist, date: "2026-10-22"}
      - {id: H2_paper_puppet, date: "2026-10-22"}
      - {id: A_drawer_curator, date: "2026-10-23", dir: assets/cast/_rejected/host_v2/A_drawer_curator}
      - {id: B_lamp_bearer, date: "2026-10-23", dir: assets/cast/_rejected/host_v2/B_lamp_bearer}
      - {id: C_paper_crane, date: "2026-10-23", dir: assets/cast/_rejected/host_v2/C_paper_crane}
  guests:
    enabled: true                           # 客串每期从卡池抽，不为角色凑选题
    pool_dir: assets/cast/guests
    promote_rule: "每 10 条复盘一次，评论点名多的客串才升常驻"

style:
  id: dark_archive_codeviz                  # D4：暗底档案 × 代码可视化；2026-10-22 用户批全案推荐
  palette: {bg: warm_black, accent: vermilion, contrast: cool_blue}
  subtitle_font: serif_cn                   # 衬线中文，关键词朱红

format:
  aspect: {main: "16:9", cut: "9:16"}       # D5：横版主片 + 竖版切片；2026-10-22 用户批全案推荐
  duration_s:                               # D6：A/B 测；2026-10-22 用户批全案推荐
    main_default: [120, 180]
    main_ab_alt: [60, 90]
    cut: [50, 70]
  dual_publish: true                        # W9：每条横竖双发；2026-10-22 用户批全案推荐

bgm:                                        # D7：可选，按期定（不设固定曲、不设任何音量或响度目标）；2026-10-22 用户批全案推荐
  mode: per_episode                         # 按期定：每期按内容挑；曲库只作候选（2026-10-22 用户定）
  allow_none: true
  library_dir: assets/bgm

seal:                                       # 印章为可选素材（不强制）；2026-10-22 用户批全案推荐
  optional: true
  asset: assets/seal/seal_t.png

voice:                                      # D8：固定 Fish TTS 声线，以后可换自录；2026-10-22 用户批全案推荐
  engine: fish
  model: s2.1-pro-free
  voice_id: 906524668b6d4afe84736962e005cd09   # 2026-10-23 用户定：Fish v2 默认声线
  temperature: 0.7
  top_p: 0.7
  latency: normal
  chunk_length: 300
  hint: "[语气平稳自然，像跟朋友聊天]"
  self_record_later: true

catchphrase:                                # D9：采用蓝图候选；2026-10-22 用户批全案推荐
  open: "调档。"
  close: "此卷，结案。"

