series_title: "{account_name}档案·第{no:03d}卷｜{column}"   # 系列编号格式；2026-10-22 用户批全案推荐
columns: [商业卷, 历史卷, 人性卷, 底层逻辑卷]  # 栏目分卷；2026-10-22 用户批全案推荐

ip:
